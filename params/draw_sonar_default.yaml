/**:
  ros__parameters:
    # Visualization parameters for draw_sonar node
    
    # Color map for rendering (inferno, plus the maps ColorMaps.h actually provides; unknown names fall back to inferno with a warning)
    color_map: "inferno"
    
    # Use logarithmic scale for intensity values (helps with dynamic range)
    # When enabled with min_db=0.0, max_db=0.0, uses full -96dB to 0dB range
    log_scale: false
    
    # Intensity range for log scale (in dB)
    # min_db: Minimum intensity threshold (0.0 = auto, uses the sample type's
    #         LSB floor: -24 dB for 8-bit, -48 dB for 16-bit, -96 dB for 32-bit)
    # max_db: Maximum intensity threshold (0.0 = auto, uses 0dB)
    # 0.0 (auto) is the only value that can never sit BELOW the sample type's
    # floor. A min_db below the floor silently washes the image out: -80
    # against 16-bit data lifts the darkest in-fan pixel to ~101/255 (see the
    # deployed settings draw_sonar.yaml for the full account).
    min_db: 0.0
    max_db: 0.0

    # Maximum range to display (0.0 = auto, uses full sonar range)
    max_range: 0.0

    # Output fan scale (pixels per meter). 0 = native, one pixel per range
    # bin, recomputed per ping; max_pixels_per_meter caps the native scale.
    pixels_per_meter: 0.0
    max_pixels_per_meter: 0.0

    # Payload layout of the subscribed SonarImageData: beam_major is the
    # standards-compliant order current drivers emit; range_major matches
    # pre-fix recordings. Operational launches override this per source.
    input_image_layout: "beam_major"

    # Draw on the GPU when available (CPU is the automatic fallback;
    # SONAR_IMAGE_PROC_FORCE_CPU=1 disables at runtime).
    use_gpu: true
    
    # Overlay grid settings
    range_spacing: 0.0       # Auto-select useful meter rings for the displayed range
    bearing_spacing: 10.0    # Spacing between bearing lines (degrees)
    bearing_at_zero: true    # Anchor the bearing grid and label at boresight
    font_scale: 0.8          # Range/bearing annotation size
    line_alpha: 0.5          # Opacity of overlay lines (0.0-1.0)
    line_thickness: 1        # Thickness of overlay lines (pixels)
    
    # Publishing options
    publish_histogram: false  # Publish histogram data
    publish_timing: true      # Publish timing information
    # One-release migration aliases. New consumers use fan_info and
    # drawn_sonar_polar; disable these after old bags/dashboards are retired.
    publish_legacy_camera_info: true
    publish_legacy_rect_topic: true
